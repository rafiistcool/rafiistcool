<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fast Path profile banner</title>
  <desc id="desc">Minimal black profile banner for Rafael Till with an electric mint speed path.</desc>
  <defs>
    <linearGradient id="fpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090b"/>
      <stop offset="1" stop-color="#0d1113"/>
    </linearGradient>
    <linearGradient id="fpLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fffd0" stop-opacity="0"/>
      <stop offset=".28" stop-color="#8fffd0"/>
      <stop offset=".72" stop-color="#c8ffe9"/>
      <stop offset="1" stop-color="#8fffd0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="fpGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="speedPath" d="M650 218 C724 218 743 113 816 113 S918 247 986 247 S1060 155 1150 155"/>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#fpBg)"/>
  <rect x="18" y="18" width="1164" height="324" rx="15" fill="url(#fpGrid)" stroke="#232b2e"/>
  <path d="M18 294H1182" stroke="#20272a"/>
  <path d="M566 18V342" stroke="#20272a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="55" y="63" fill="#8fffd0" font-size="11" letter-spacing="3">FAST_PATH / PROFILE</text>
    <circle cx="40" cy="59" r="3.5" fill="#8fffd0">
      <animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <text x="54" y="163" fill="#f2f5f3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="760" letter-spacing="-2">RAFAEL TILL</text>
    <text x="57" y="203" fill="#8fffd0" font-size="14" letter-spacing="2.5">LIGHTWEIGHT SOFTWARE. FAST FEEDBACK.</text>
    <text x="57" y="244" fill="#748087" font-size="12" letter-spacing="1.2">small surface  /  short paths  /  no bloat</text>

    <text x="55" y="318" fill="#596267" font-size="10" letter-spacing="1.4">github.com/rafiistcool</text>
    <text x="1150" y="318" text-anchor="end" fill="#596267" font-size="10" letter-spacing="1.4">JAVA  ·  RUST  ·  SPRING  ·  VUE</text>
  </g>

  <g>
    <use href="#speedPath" fill="none" stroke="#8fffd0" stroke-opacity=".08" stroke-width="18"/>
    <use href="#speedPath" fill="none" stroke="#8fffd0" stroke-opacity=".16" stroke-width="7"/>
    <use href="#speedPath" fill="none" stroke="url(#fpLine)" stroke-width="2.5" filter="url(#fpGlow)"/>
    <use href="#speedPath" fill="none" stroke="#c8ffe9" stroke-width="2" stroke-dasharray="16 420">
      <animate attributeName="stroke-dashoffset" values="440;0" dur="2.2s" repeatCount="indefinite"/>
    </use>
    <circle r="5" fill="#c8ffe9" filter="url(#fpGlow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#speedPath"/>
      </animateMotion>
    </circle>
  </g>

  <g fill="#8fffd0">
    <circle cx="650" cy="218" r="3"/>
    <circle cx="816" cy="113" r="3"/>
    <circle cx="986" cy="247" r="3"/>
    <circle cx="1150" cy="155" r="3"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#667277">
    <text x="638" y="238" text-anchor="end">INPUT</text>
    <text x="816" y="94" text-anchor="middle">THINK</text>
    <text x="986" y="268" text-anchor="middle">BUILD</text>
    <text x="1150" y="136" text-anchor="end">SHIP</text>
  </g>
</svg>
